# Aegis — full stack: Postgres + FastAPI backend + React frontend (nginx).
#
#   cp .env.example .env      # then fill in the REQUIRED values
#   docker compose up --build
#
#   Dashboard → http://localhost:5173
#   API       → http://localhost:8000   (docs at /docs when ENVIRONMENT=development)

name: aegis

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Password is passed through from .env by name only (never written here);
      # Postgres refuses to initialise if it's empty.
      - POSTGRES_PASSWORD
      - POSTGRES_USER=${POSTGRES_USER:-aegis}
      - POSTGRES_DB=${POSTGRES_DB:-aegis_db1}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host. Uncomment to reach it with psql/pgAdmin locally:
    # ports:
    #   - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    image: aegis-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    # Lets the API deliver webhooks to services on your machine (e.g. the Mock Bank):
    # use http://host.docker.internal:<port>/... as the webhook URL. Works on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aegis_db1}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CHROMA_PERSIST_DIR: /data/chroma_data
      HF_HOME: /data/hf_cache
      # Trust X-Forwarded-For only from nginx (frontend's fixed IP below), so the real
      # client IP is logged/rate-limited for dashboard traffic but can't be spoofed via :8000.
      FORWARDED_ALLOW_IPS: ${AEGIS_PROXY_IP:-10.177.42.10}
    networks:
      - default   # db (and anything else) lives here
      - proxy     # nginx reaches the backend here
    volumes:
      - chroma_data:/data/chroma_data     # vector store
      - hf_cache:/data/hf_cache           # embedding model download cache
      - client_storage:/app/storage       # uploaded policy PDFs
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: aegis-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080"
    networks:
      proxy:
        ipv4_address: ${AEGIS_PROXY_IP:-10.177.42.10}   # = backend FORWARDED_ALLOW_IPS
    # Never forward bare names like "backend" to the host's DNS while the backend container
    # is down (a LAN/ISP resolver could answer and receive proxied credentials).
    dns_opt:
      - ndots:1

networks:
  # nginx <-> backend only, on a fixed subnet so nginx gets a known IP (uvicorn trusts proxies
  # by exact IP only). A separate network rather than pinning "default", so upgrades never have
  # to recreate the network the database is on. Dynamic addresses come from AEGIS_IP_RANGE and
  # never collide with AEGIS_PROXY_IP. The default sits outside Docker's own address pools;
  # override all three in .env if it clashes with your LAN/VPN or you run a second copy.
  proxy:
    ipam:
      config:
        - subnet: ${AEGIS_SUBNET:-10.177.42.0/24}
          ip_range: ${AEGIS_IP_RANGE:-10.177.42.128/25}

volumes:
  pgdata:
  chroma_data:
  hf_cache:
  client_storage:
