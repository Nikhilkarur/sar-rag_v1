# Serves the built SPA and reverse-proxies API calls to the backend container,
# so the browser talks to a single origin (no CORS needed).

# Keep the client's original scheme when another TLS proxy sits in front of this one.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Forward the client's Host *with* its port (localhost:5173) so backend redirects point back
# here; fall back to $host when a client sends no Host header, so the backend's internal
# address never ends up in a redirect.
map $http_host $upstream_host {
    default $http_host;
    ""      $host;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Resolve "backend" through Docker's embedded DNS at request time (not once at startup),
    # so nginx starts even while the backend is down and follows it when it's recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Matches the backend's MAX_INGEST_PAYLOAD_BYTES; policy uploads get their own limit below.
    client_max_body_size 5m;
    error_page 413 = @payload_too_large;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|files)/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $backend;
    }

    location = /api/v1/documents/upload {
        client_max_body_size 50m;   # matches MAX_UPLOAD_FILE_SIZE_MB (policy PDF uploads)
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $backend;
    }

    location = /health {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $backend;
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"detail":"Payload too large"}';
    }

    # Hashed build assets can be cached forever. (add_header here replaces the server-level
    # headers, so the security headers are included again.)
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # No `always`: errors (e.g. a 404 for a not-yet-deployed asset) must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
